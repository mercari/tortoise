apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: sample
  namespace: default
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: istio-proxy
        image: istio-proxy:1.0.0
        ports:
        - containerPort: 81
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80