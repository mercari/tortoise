apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mercari-app
  namespace: default
spec:
  replicas: 10
  restartAt: "2023-01-01T00:00:00Z"
  selector:
    matchLabels:
      app: mercari
  strategy:
    canary: {}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mercari-app
