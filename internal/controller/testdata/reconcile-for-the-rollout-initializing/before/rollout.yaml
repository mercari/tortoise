apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: mercari-app
  namespace: default
spec:
  selector:
    matchLabels:
      app: mercari
  strategy:
    canary: {}
  template:
    metadata:
      labels:
        app: mercari
    spec:
      containers:
      - image: awesome-mercari-app-image
        name: app
        resources:
          requests:
            cpu: "4"
            memory: 4Gi
  replicas: 10
